name: shutr
description: Peer-to-peer collaborative photo gallery app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & P2P (same-network V1)
  network_info_plus: ^6.0.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.0
  http: ^1.2.0
  multicast_dns: ^0.3.2+1
  
  # Media
  photo_manager: ^3.3.0
  photo_manager_image_provider: ^2.1.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  exif: ^3.1.4
  image: ^4.2.0
  
  # Storage & State
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  uuid: ^4.4.0
  
  # UI
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  
  # Notifications & Utils
  flutter_local_notifications: ^17.2.2
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  google_fonts: ^8.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/